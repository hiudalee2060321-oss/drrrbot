name: Drrr Keep Alive Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect and Start Drrr Bot
        run: |
          ls -la
          cat README_zh-CN.md || cat README.md || true
          if [ -f "package.json" ]; then npm install; fi
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "bot.mjs" ]; then node bot.mjs;
          elif [ -f "index.js" ]; then node index.js;
          elif [ -f "bot.js" ]; then node bot.js;
          elif [ -f "app.js" ]; then node app.js;
          elif [ -f "main.py" ]; then python3 main.py;
          elif [ -f "bot.py" ]; then python3 bot.py;
          else npm start; fi
